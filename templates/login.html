<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — {{ app_brand }}</title>
    <link rel="stylesheet" href="/static/dist/app.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
        <div class="mb-8">
          <p class="text-sm font-semibold uppercase tracking-widest text-blue-600">Защищённый контур</p>
          <h1 class="mt-2 text-3xl font-bold">{{ app_brand }}</h1>
          <p class="mt-2 text-sm text-slate-500">Войдите с локальной корпоративной учётной записью.</p>
        </div>
        {% if error %}
        <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" class="space-y-5">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next_url" value="{{ next_url }}" />
          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Пользователь</span>
            <input name="username" required autocomplete="username" autofocus class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
          </label>
          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Пароль</span>
            <input type="password" name="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />
          </label>
          <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Войти</button>
        </form>
      </section>
    </main>
  </body>
</html>
