<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_brand }}</title>
    <link rel="stylesheet" href="/static/dist/app.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
        <h1 class="text-3xl font-bold">{{ app_brand }}</h1>
        {% if not keycloak %}
        <p class="mt-3 text-sm text-slate-500">Сервер авторизации ещё не задан.</p>
        {% endif %}
        {% if error %}
        <div class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
        {% endif %}
        {% if keycloak %}
        <a href="/login/keycloak?next={{ next_url | urlquote }}" class="mt-6 block w-full rounded-xl bg-blue-600 px-4 py-3 text-center font-semibold text-white hover:bg-blue-700">Продолжить</a>
        {% endif %}
      </section>
    </main>
  </body>
</html>
