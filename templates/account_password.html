<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Смена пароля — {{ app_brand }}</title>
    <link rel="stylesheet" href="/static/dist/app.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
        <h1 class="text-2xl font-bold">Смена пароля</h1>
        <p class="mt-2 text-sm text-slate-500">Пароль администратора нужно обновлять каждые 60 дней. Новый пароль — не менее 12 символов.</p>
        {% if error %}
        <p class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
        {% endif %}
        <form method="post" action="/account/password" class="mt-6 space-y-4">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="password" name="current_password" required placeholder="Текущий пароль" autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          <input type="password" name="new_password" required minlength="12" placeholder="Новый пароль" autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2" />
          <button class="w-full rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700">Сохранить</button>
        </form>
      </section>
    </main>
  </body>
</html>
