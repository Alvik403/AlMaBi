name: almabi

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard_web
    ports:
      - "18001:8000"
    environment:
      DEBUG: "true"
      APP_PORT: "8000"
      UPLOADS_DIR: /app/uploads
      RUNTIME_DIR: /app/runtime
      LOGS_DIR: /app/logs
    volumes:
      - ./uploads:/app/uploads
      - ./runtime:/app/runtime
      - ./logs:/app/logs
    working_dir: /app
    # Без --reload: иначе watchfiles перезапускает сервер при каждой записи в ./logs
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
