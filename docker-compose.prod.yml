name: almabi-prod

services:
  web:
    image: "${ALMABI_IMAGE:-almabi-web:local}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEBUG: "false"
      AUTH_ENABLED: "true"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in the production environment}"
      SESSION_HTTPS_ONLY: "true"
      ALLOWED_HOSTS: "${ALMABI_HOST:?Set ALMABI_HOST to the production DNS name}"
      AUDIT_DETAIL_ENABLED: "false"
      MAX_UPLOAD_BYTES: "52428800"
      UPLOAD_QUOTA_BYTES: "524288000"
      UPLOADS_DIR: /app/uploads
      RUNTIME_DIR: /app/runtime
      LOGS_DIR: /app/logs
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
      - runtime:/app/runtime
      - logs:/app/logs
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    user: "10001:10001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]

  nginx:
    image: "${NGINX_IMAGE:-nginx:stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/tls:/etc/nginx/tls:ro
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    user: "101:101"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/usr/sbin/nginx", "-t", "-q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  edge:
  backend:
    internal: true

volumes:
  uploads:
  runtime:
  logs:
