name: almabi-prod

services:
  web:
    image: "${ALMABI_IMAGE:-almabi-web:local}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEBUG: "false"
      AUTH_ENABLED: "true"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      SESSION_SECRET_FILE: /run/secrets/session_secret
      DATA_KEY_FILE: /run/secrets/data_key
      SESSION_HTTPS_ONLY: "true"
      SESSION_IDLE_SECONDS: "900"
      SECRET_MAX_AGE_DAYS: "60"
      RETENTION_INTERVAL_DAYS: "10"
      AUTH_DATABASE_URL: postgresql://almabi@db:5432/almabi
      AUTH_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      TLS_CERT_FILE: /tls/fullchain.pem
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
      ALLOWED_HOSTS: "${ALMABI_HOST:?Set ALMABI_HOST to the production DNS name}"
      AUDIT_DETAIL_ENABLED: "false"
      REQUEST_TIMEOUT_SECONDS: "900"
      UVICORN_WORKERS: "1"
      DASHBOARD_CACHE_MAX_ENTRIES: "8"
      DASHBOARD_SKIP_DEEP_COPY: "true"
      PIPELINE_SKIP_AUDIT_WHEN_DISABLED: "true"
      PERF_LOG_ENABLED: "false"
      MAX_UPLOAD_BYTES: "52428800"
      UPLOAD_QUOTA_BYTES: "524288000"
      UPLOADS_DIR: /app/uploads
      RUNTIME_DIR: /app/runtime
      LOGS_DIR: /app/logs
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
      - runtime:/app/runtime
      - logs:/app/logs
      - ./ops/tls:/tls:ro
      - staged_secrets:/run/secrets:ro
    networks:
      - backend
      - edge
    depends_on:
      db:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    user: "10001:10001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-1} --proxy-headers --forwarded-allow-ips='*'",
      ]

  nginx:
    image: "${NGINX_IMAGE:-nginx:stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "443:8443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/tls:/etc/nginx/tls:ro
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    user: "101:101"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/usr/sbin/nginx", "-t", "-q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

  secret-init:
    image: "${ALMABI_IMAGE:-almabi-web:local}"
    user: "0:0"
    restart: "no"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    pids_limit: 32
    mem_limit: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    secrets:
      - session_secret
      - data_key
      - db_password
      - keycloak_client_secret
    volumes:
      - staged_secrets:/secrets
    networks:
      - backend
    command:
      - sh
      - -c
      - |
        set -eu
        for name in session_secret data_key db_password keycloak_client_secret; do
          cp "/run/secrets/$$name" "/secrets/$$name"
          chmod 400 "/secrets/$$name"
          chown 10001:10001 "/secrets/$$name"
        done

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: almabi
      POSTGRES_DB: almabi
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almabi -d almabi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  uploads:
  runtime:
  logs:
  db:
  staged_secrets:

secrets:
  session_secret:
    file: ${ALMABI_SESSION_SECRET_FILE:-ops/secrets/session_secret}
  data_key:
    file: ${ALMABI_DATA_KEY_FILE:-ops/secrets/data_key}
  db_password:
    file: ${ALMABI_DB_PASSWORD_FILE:-ops/secrets/db_password}
  keycloak_client_secret:
    file: ${ALMABI_KEYCLOAK_SECRET_FILE:-ops/secrets/keycloak_client_secret}
